  <!-- ============ ARCHIVE VIEW ============ -->
  <div class="view" id="view-archive">
    <div class="page-head">
      <div class="page-title">Request Archive</div>
      <div class="page-sub">All reviewed branch status requests, most recent first.</div>
    </div>
    <div class="filter-row">
      <div class="filter-chip active" data-filter="all">All</div>
      <div class="filter-chip" data-filter="approved">Approved</div>
      <div class="filter-chip" data-filter="rejected">Rejected</div>
    </div>
    <div class="req-list" id="archiveList"></div>
  </div>
