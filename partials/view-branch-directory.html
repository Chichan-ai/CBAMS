  <!-- ============ BRANCH DIRECTORY VIEW ============ -->
  <div class="view" id="view-branch-directory">
    <div class="page-head">
      <div class="page-title">Branch Directory</div>
      <div class="page-sub">Branches grouped by region. Click a branch to view its date opened and location.</div>
    </div>
    <div class="directory-head-row">
      <input type="text" id="directorySearch" class="directory-search" placeholder="Search branch name or code…">
      <button type="button" class="btn btn-primary admin-only" id="openAddBranchBtn">+ Add Branch</button>
    </div>
    <div class="directory-layout">
      <div class="directory-list" id="directoryList"></div>
      <div class="directory-detail" id="directoryDetail">
        <div class="directory-empty">Select a branch from the list to view its date opened and location.</div>
      </div>
    </div>
  </div>
